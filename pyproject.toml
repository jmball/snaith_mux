[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "snaith-mux"
version = "0.1.0"
description = "Standalone Snaith PCB TCP multiplexor driver"
readme = "README.md"
requires-python = ">=3.13"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
dependencies = []

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.14", "ty>=0.0.1", "build>=1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
snaith_mux = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ty.src]
include = ["src", "tests", "examples"]
